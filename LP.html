<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo — Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Acme&family=Alumni+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        html {
            min-height: 100%;
            background: linear-gradient(180deg, #171a1d 0%, #242424 100%);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #171a1d 0%, #242424 100%);
            margin: 0;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            animation: page-reveal 1.5s ease-in-out both;
        }

        @keyframes page-reveal {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            body {
                animation: none;
            }
        }

        .menu-section {
            position: relative;
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
        }

        .menu-section::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.18)) center / 100% 100% no-repeat,
                url("Photo/_DSC1992.jpg") center bottom / cover no-repeat;
        }

        .menu-telegram {
            position: absolute;
            top: 30px;
            right: 3%;
            z-index: 1;
            display: block;
            width: 56px;
            height: 56px;
            transition: transform 0.25s ease;
        }

        .menu-alpha {
            position: absolute;
            top: 24px;
            left: 2.3%;
            z-index: 1;
            width: clamp(120px, 13vw, 170px);
            height: auto;
            object-fit: contain;
        }

        .menu-telegram:hover {
            transform: scale(1.06);
        }

        .menu-telegram img,
        .menu-brand img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .menu-logo {
            position: absolute;
            top: 82%;
            left: 74%;
            z-index: 1;
            width: clamp(320px, 42vw, 560px);
            transform: translate(-50%, -50%);
        }

        .menu-projects {
            position: absolute;
            left: 4.5%;
            bottom: 5%;
            z-index: 1;
            color: #fff;
            font-family: "Alumni Sans", sans-serif;
            font-size: clamp(32px, 5vw, 62px);
            font-weight: 300;
            text-decoration: none;
            transition: transform 0.25s ease;
        }

        .menu-projects:hover {
            transform: translateY(5px);
        }

        .menu-brand {
            position: fixed;
            right: 1.5%;
            bottom: 2%;
            z-index: 20;
            width: clamp(120px, 15vw, 205px);
            height: 44px;
        }

        .site-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            min-height: 68px;
            margin-bottom: 8px;
        }

        .gallery-section {
            padding: 12px 20px 100px;
        }

        .section-divider {
            width: 100%;
            height: 1px;
            margin: -44px 0 44px;
            background: rgba(255, 255, 255, 0.75);
        }

        .site-logo {
            justify-self: start;
            color: #e8e8e8;
            font-family: "Acme", sans-serif;
            font-size: clamp(26px, 3.2vw, 38px);
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .gallery-link {
            justify-self: center;
            color: #777;
            font-size: clamp(20px, 2.4vw, 28px);
            font-weight: 700;
        }

        .telegram-link {
            justify-self: end;
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 2px solid #e8e8e8;
            border-radius: 50%;
            color: #e8e8e8;
            transition: color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
        }

        .telegram-link:hover {
            color: #078cff;
            border-color: #078cff;
            transform: scale(1.06);
        }

        .telegram-link svg {
            width: 27px;
            height: 27px;
            fill: currentColor;
        }

        .teardown-social-links {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: clamp(6px, 1vw, 12px);
        }

        .boosty-link {
            position: relative;
            top: -3px;
            display: block;
            width: clamp(70px, 7.5vw, 110px);
            height: 34px;
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .boosty-link:hover {
            transform: scale(1.06);
            filter: brightness(1.12);
        }

        .boosty-link img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slider-wrapper {
            width: 100%;
        }

        .slider-container {
            position: relative;
            border: 4px solid #078cff;
            box-shadow: 0 0 8px #078cff, 0 0 20px rgba(0, 140, 255, 0.75);
            overflow: visible;
            background-color: #101820;
            padding: 10px;
            box-sizing: border-box;
        }

        .slider-track {
            display: flex;
            width: 100%;
            gap: 10px;
            box-sizing: border-box;
        }

        .slide {
            flex: 1 1 0;
            min-width: 0;
            aspect-ratio: 3 / 2;
            position: relative;
            overflow: visible;
            box-sizing: border-box;
            z-index: 1;
        }

        .slide:not(.album-slide):hover {
            z-index: 10;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: pointer;
            background-color: #000;
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                        filter 0.45s ease,
                        opacity 0.45s ease;
        }

        .slide:not(.album-slide):hover img {
            transform: scale(1.06);
            filter: brightness(1.08);
        }

        .album-slide-link:hover ~ .album-link {
            color: #4facfe;
        }

        .album-slide-link:hover + .album-link {
            color: #4facfe;
        }

        .slide.album-slide {
            background: #000;
        }

        .album-slide-link {
            position: absolute;
            inset: 0;
            display: block;
            text-decoration: none;
            z-index: 2;
            cursor: pointer;
        }

        .album-slide img {
            opacity: 0.55;
        }

        .album-slide::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.7));
            pointer-events: none;
        }

        .album-link {
            position: absolute;
            right: 12px;
            bottom: 10px;
            z-index: 1;
            color: #ffffff;
            font-family: "Alumni Sans", sans-serif;
            font-size: clamp(14px, 2vw, 24px);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .album-link:hover {
            color: #4facfe;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .lightbox.open {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform: scale(0.92);
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .lightbox.open img {
            transform: scale(1);
        }

        @media (max-width: 560px) {
            .menu-alpha {
                top: 12px;
                left: 12px;
                width: 105px;
            }

            .menu-telegram {
                top: 18px;
                right: 18px;
                width: 44px;
                height: 44px;
            }

            .menu-logo { top: 78%; left: 65%; width: min(98vw, 420px); }
            .menu-projects { left: 5%; bottom: 8%; }
            .menu-brand { right: 2%; width: 125px; height: 34px; }

            .gallery-section { padding: 12px 12px 80px; }
            .section-divider { margin: -32px 0 32px; }

            .site-header {
                min-height: 56px;
                margin-bottom: 8px;
            }

            .telegram-link {
                width: 40px;
                height: 40px;
            }

            .boosty-link {
                top: -2px;
                width: 56px;
                height: 26px;
            }

            .slider-container { padding: 6px; border-width: 3px; }
            .slider-track { gap: 6px; }
        }
    </style>
</head>
<body>

<section class="menu-section" id="menu" aria-label="Menu">
    <img class="menu-alpha" src="Photo/Alpha_test.png" alt="Alpha test">
    <a class="menu-telegram" href="https://t.me/Lysmik_Photo" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram">
        <img src="Photo/TG.png" alt="">
    </a>
    <img class="menu-logo" src="Photo/Lysmik.png" alt="Lysmik">
    <a class="menu-projects" href="#gallery">Мои проекты↓</a>
    <a class="menu-brand" href="https://t.me/Lysmik" target="_blank" rel="noopener noreferrer" aria-label="Lysmik в Telegram">
        <img src="Photo/Lysmik-2.png" alt="">
    </a>
</section>

<main class="gallery-section" id="gallery">
<header class="site-header">
    <span class="site-logo">Photo</span>
    <span class="gallery-link">Gallery</span>
    <a class="telegram-link" href="https://t.me/Lysmik_Photo" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.8 4.2 18.6 19c-.24 1.05-.86 1.3-1.74.81l-4.8-3.54-2.32 2.23c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.09-.55-.61-.2L6.39 12.93 1.65 11.45c-1.03-.32-1.05-1.03.22-1.53L20.4 2.77c.85-.31 1.59.21 1.4 1.43Z"/>
        </svg>
    </a>
</header>

<div class="slider-wrapper">
    <div class="slider-container">
        <div class="slider-track" id="track">
            <div class="slide">
                <img src="Photo/_DSC1236.jpg" alt="Ночной город">
            </div>
            <div class="slide">
                <img src="Photo/_DSC1269.jpg" alt="АЗС Лукойл">
            </div>
            <div class="slide">
                <img src="Photo/_DSC0398.jpg" alt="Граффити на окне">
            </div>
            <div class="slide album-slide">
                <img src="Photo/_DSC1236.jpg" alt="" aria-hidden="true">
                <a href="Photo_Gallery.html" class="album-slide-link" aria-label="Открыть весь альбом"></a>
                <span class="album-link">Весь альбом</span>
            </div>
        </div>
    </div>
</div>

<div class="lightbox" id="lightbox" aria-hidden="true">
    <img src="" alt="Просмотр фотографии">
</div>
</main>

<div class="section-divider" aria-hidden="true"></div>

<section class="gallery-section teardown-section" id="teardown-gallery" aria-label="My modifications for Teardown">
    <header class="site-header">
        <span class="site-logo">My modifications for Teardown</span>
        <span class="gallery-link">Gallery</span>
        <div class="teardown-social-links">
            <a class="boosty-link" href="https://boosty.to/fly.lind" target="_blank" rel="noopener noreferrer" aria-label="Поддержать на Boosty">
                <img src="Photo/Boosty.png" alt="">
            </a>
            <a class="telegram-link" href="https://t.me/aB88777" target="_blank" rel="noopener noreferrer" aria-label="Открыть Telegram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21.8 4.2 18.6 19c-.24 1.05-.86 1.3-1.74.81l-4.8-3.54-2.32 2.23c-.26.26-.48.48-.98.48l.35-4.9 8.92-8.06c.39-.35-.09-.55-.61-.2L6.39 12.93 1.65 11.45c-1.03-.32-1.05-1.03.22-1.53L20.4 2.77c.85-.31 1.59.21 1.4 1.43Z"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="slider-wrapper">
        <div class="slider-container">
            <div class="slider-track">
                <div class="slide">
                    <img src="Photo/P-2.jpg" alt="Кинотеатр в My modifications for Teardown">
                </div>
                <div class="slide">
                    <img src="Photo/P-4.jpg" alt="Здание в My modifications for Teardown">
                </div>
                <div class="slide">
                    <img src="Photo/P-3.jpg" alt="Магазин в My modifications for Teardown">
                </div>
                <div class="slide album-slide">
                    <img src="Photo/P-1.jpg" alt="" aria-hidden="true">
                    <a href="Photo_Gallery.html?album=teardown" class="album-slide-link" aria-label="Открыть весь альбом My modifications for Teardown"></a>
                    <span class="album-link">Весь альбом</span>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = lightbox.querySelector('img');
    const projectsLink = document.querySelector('.menu-projects');
    let scrollAnimationFrame;

    projectsLink.addEventListener('click', (event) => {
        event.preventDefault();
        history.pushState(null, '', projectsLink.getAttribute('href'));

        const target = document.querySelector(projectsLink.getAttribute('href'));
        const startY = window.scrollY;
        const endY = target.getBoundingClientRect().top + startY;
        const distance = endY - startY;
        const duration = 2000;
        const startTime = performance.now();
        const root = document.documentElement;
        const previousScrollBehavior = root.style.scrollBehavior;
        root.style.scrollBehavior = 'auto';
        cancelAnimationFrame(scrollAnimationFrame);

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            window.scrollTo(0, endY);
            root.style.scrollBehavior = previousScrollBehavior;
            return;
        }

        function animateScroll(now) {
            const progress = Math.min((now - startTime) / duration, 1);
            const easedProgress = progress < 0.5
                ? 16 * progress ** 5
                : 1 - ((-2 * progress + 2) ** 5) / 2;

            window.scrollTo(0, startY + distance * easedProgress);

            if (progress < 1) {
                scrollAnimationFrame = requestAnimationFrame(animateScroll);
            } else {
                root.style.scrollBehavior = previousScrollBehavior;
            }
        }

        scrollAnimationFrame = requestAnimationFrame(animateScroll);
    });

    document.querySelectorAll('.slider-track').forEach((track) => {
        track.querySelectorAll('.slide:not(.album-slide) img').forEach((image) => {
            image.addEventListener('click', () => {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt;
                lightbox.classList.add('open');
                lightbox.setAttribute('aria-hidden', 'false');
            });
        });
    });

    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('open');
        lightbox.setAttribute('aria-hidden', 'true');
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
        }
    });
</script>

</body>
</html>
